titre: Gérer
sousTitre: des données de l'information
annee: but1
code: C4
icone: database
description: Concevoir, exploiter et administrer des bases de données pour piloter l'information.
presentation: ''
acs:
- code: AC14-01
  titre: Mettre à jour et interroger une base relationnelle
  description: Créer des requêtes SQL, concevoir une base de données.
  blocs:
  - discriminant: texte
    value:
      titre: ''
      texte: Dans le cadre de la SAÉ 2.04, j'ai mis en œuvre le langage SQL pour exploiter la base de données de gestion des absences des étudiants. J'ai rédigé le script d'insertion des données initiales. J'ai également écrit des requêtes d'interrogation et de manipulation de données pour répondre aux besoins des différents profils utilisateurs (Secrétaire, Enseignant, Directeur des études), en utilisant des jointures, des vues et en gérant les droits d'accès via la création de rôles SQL.
      miseEnAvant: true
