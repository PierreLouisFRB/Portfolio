- code: AC14-02
  titre: Visualiser des données
  description: Choisir et produire des représentations graphiques adaptées pour communiquer des données.
  blocs:
  - discriminant: texte
    value:
      titre: ''
      texte: Afin de rendre les données compréhensibles pour un utilisateur ou un client, j'ai mis en forme les résultats obtenus via nos requêtes pour présenter les indicateurs clés demandés dans le sujet.
      miseEnAvant: true
