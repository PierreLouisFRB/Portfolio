- code: AC14-03
  titre: Concevoir une base de données relationnelle
  description: Modéliser un schéma entité-association, normaliser et générer le schéma SQL correspondant.
  blocs:
  - discriminant: texte
    value:
      titre: ''
      texte: Avant de coder la base de données, j'ai participé à sa modélisation. À partir d'un cahier des charges textuel, j'ai extrait les règles de gestion pour concevoir le Modèle Conceptuel de Données (MCD) puis le Modèle Logique de Données (MLD). J'ai défini les entités, les types d'attributs, ainsi que les clés primaires et étrangères afin d'assurer l'intégrité et la cohérence de la base.
      miseEnAvant: true
