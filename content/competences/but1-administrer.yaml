- code: AC13-04
  titre: Configurer un poste dans un réseau d'entreprise
  description: Configurer adressage IP, DNS, passerelle ; diagnostiquer la connectivité réseau.
  blocs:
  - discriminant: texte
    value:
      titre: ''
      texte: Pour l'infrastructure de la SAÉ 2.03, l'intégralité du serveur web et de la base de données a été déployée sur une machine virtuelle Linux isolée. J'ai appris à me connecter à cet environnement virtualisé, à comprendre l'importance de l'isolation des services (séparation de la machine hôte et de la machine de production) et à configurer le serveur Apache pour qu'il serve les pages web et exécute les requêtes de l'application CGI à travers le réseau.
      miseEnAvant: true
  - discriminant: image
    value:
      image: /uploads/images/but1-administrer/acs/3/blocs/1/value/image.png
      legende: ''
