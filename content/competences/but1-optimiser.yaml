titre: Optimiser
sousTitre: ''
annee: but1
code: C2
icone: cpu
description: Appréhender et construire des algorithmes, évaluer leur complexité et les optimiser.
presentation: ''
acs:
- code: AC12-01
  titre: Analyser un problème avec méthode
  description: Décomposer un problème en sous-problèmes, choisir les structures de données appropriées.
  blocs:
  - discriminant: texte
    value:
      titre: ''
      texte: Dans le cadre de la SAÉ 2.02, j'ai dû manipuler et sélectionner des structures de données Java adaptées pour modéliser le donjon sous forme de graphe. Afin de stocker les nœuds visités et optimiser les algorithmes, j'ai mis en œuvre des structures de données de l'API Java Collections telles que HashSet pour assurer l'unicité des éléments et éviter les cycles de recherche. Pour l'algorithme A*, j'ai utilisé une file de priorité (PriorityQueue) associée à un Comparator personnalisé pour extraire efficacement le nœud ayant le coût estimé le plus faible.
      miseEnAvant: true
- code: AC12-02
  titre: Comparer des algorithmes pour des problèmes classiques
  description: Évaluer et comparer la complexité temporelle/spatiale d'algorithmes de tris et de recherches.
  blocs:
  - discriminant: texte
    value:
      titre: ''
      texte: 'Pour résoudre le problème du plus court chemin entre deux salles d''un donjon, j''ai implémenté trois algorithmes fondamentaux de la théorie des graphes en programmation orientée objet : le parcours en profondeur (DFS), le parcours en largeur (BFS) pour trouver le chemin minimal en nombre d''arêtes, et l''algorithme informé A* combinant la distance réelle parcourue et une fonction heuristique. J''ai également codé les modules de transformation pour transposer les données textuelles du donjon en un format de graphe exploitable.'
      miseEnAvant: true
- code: AC12-03
  titre: Formaliser et mettre en œuvre des outils mathématiques
  description: Mobiliser algèbre de Boole, arithmétique, logique, graphes et probabilités en informatique.
  blocs:
  - discriminant: texte
    value:
      titre: ''
      texte: Une fois les algorithmes fonctionnels, j'ai mené une étude comparative en collectant le temps d'exécution ainsi que le nombre d'étapes (steps) nécessaires à la résolution sur un ensemble de 8 donjons tests. L'analyse des résultats statistiques m'a permis de chiffrer l'efficacité de chaque approche. J'ai pu observer empiriquement l'impact majeur de la fonction heuristique de A* qui réduit drastiquement l'espace de recherche (le nombre de nœuds visités) par rapport à un parcours à l'aveugle comme BFS, optimisant ainsi l'usage des ressources système.
      miseEnAvant: true
